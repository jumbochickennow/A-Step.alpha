name: Security CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SITE_URL: https://astep.example
    defaults:
      run:
        working-directory: "make smecta"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "make smecta/package-lock.json"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Type and syntax checks
        run: |
          npx --no-install tsc --noEmit --pretty false
          npm run check
          npm run check:migrations

      - name: Security regression assertions
        run: |
          npm run test:security
          node scripts/verify-env.mjs --self-test

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Production build
        run: npm run build

      - name: Public asset security audit
        run: npm run check:assets

  secret-detection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
